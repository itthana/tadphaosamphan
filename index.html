    function loadSavedData() {
      try {
        const raw = localStorage.getItem('tps_portal_state_v6');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.bookings) state.bookings = parsed.bookings;
          if (parsed.contactInquiries) state.contactInquiries = parsed.contactInquiries;
          if (parsed.partnerInquiries) state.partnerInquiries = parsed.partnerInquiries;
          if (parsed.activities) state.activities = parsed.activities;
          if (parsed.tickets) state.tickets = parsed.tickets;
          if (parsed.gallery) state.gallery = parsed.gallery;
          if (parsed.newsList) state.newsList = parsed.newsList;
          if (parsed.siteSettings) state.siteSettings = { ...state.siteSettings, ...parsed.siteSettings };
          if (parsed.djiSlides) state.djiSlides = parsed.djiSlides;
          if (parsed.translations) state.translations = parsed.translations;
          if (parsed.adminUsers) state.adminUsers = parsed.adminUsers;
          if (parsed.liveParkStatus) state.liveParkStatus = { ...state.liveParkStatus, ...parsed.liveParkStatus };
        }
      } catch (e) {
        console.warn('Local storage load notice:', e);
      }
    }

    function formatLAK(amount) {
      if (!amount || Number(amount) <= 0) {
        return state.lang === 'LA' ? 'ລໍຖ້າປະກາດລາຄາ' : state.lang === 'TH' ? 'รอประกาศราคา' : 'TBA';
      }
      return Number(amount).toLocaleString() + ' LAK';
    }

    function updateBudgetPlanner() {
      const pkgSelect = document.getElementById('calc-pkg-select');
      const adultsInput = document.getElementById('calc-adults-input');
      const childrenInput = document.getElementById('calc-children-input');
      if (!pkgSelect || !adultsInput || !childrenInput) return;

      const pkgCode = pkgSelect.value;
      const adults = Math.max(1, Number(adultsInput.value || 1));
      const children = Math.max(0, Number(childrenInput.value || 0));

      const tk = state.tickets.find(item => item.code === pkgCode) || state.tickets[0];
      const childTk = state.tickets.find(item => item.code === 'CHD-STD');
      const childRate = childTk ? childTk.priceLAK : 10000;

      let totalLAK = 0;
      if (pkgCode === 'PKG-FAM') {
        totalLAK = tk.priceLAK;
      } else {
        totalLAK = (adults * tk.priceLAK) + (children * childRate);
      }

      const approxTHB = Math.round(totalLAK / 630);
      const approxUSD = (totalLAK / 22000).toFixed(1);

      const lakEl = document.getElementById('calc-res-lak');
      const thbEl = document.getElementById('calc-res-thb');
      const usdEl = document.getElementById('calc-res-usd');
      const bookBtn = document.getElementById('calc-book-btn');

      if (lakEl) lakEl.textContent = totalLAK.toLocaleString() + ' LAK';
      if (thbEl) thbEl.textContent = '≈ ' + approxTHB.toLocaleString() + ' THB (บาทไทย)';
      if (usdEl) usdEl.textContent = '≈ $' + approxUSD + ' USD';
      if (bookBtn) {
        bookBtn.onclick = function () {
          openBookingWithPackage(pkgCode);
        };
      }
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.className = 'fixed top-24 right-4 z-50 max-w-md bg-[#123D32] text-[#F8F6EF] border-2 border-[#C5A46D] px-5 py-4 rounded-2xl shadow-2xl flex items-start gap-3 transition-all';
      container.innerHTML = `
        <div class="mt-0.5 shrink-0 ${type === 'error' ? 'text-amber-400' : 'text-[#329C9B]'}">
          ${type === 'error' ? '⚠️' : '✓'}
        </div>
        <div class="text-xs sm:text-sm leading-relaxed flex-1 font-medium safe-text">${msg}</div>
        <button onclick="document.getElementById('toast-container').classList.add('hidden')" class="text-[#F8F6EF]/70 hover:text-white text-sm font-bold">✕</button>
      `;
      container.classList.remove('hidden');
      setTimeout(() => {
        container.classList.add('hidden');
      }, 4500);
    }

    function copyText(text, label = 'Copied') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`${label}: ${text}`);
      } catch (e) {
        showToast(text);
      }
    }

    // ============================================================================
    // 8. IMAGE UPLOAD & DNG RAW EXTRACTOR
    // ============================================================================
    function extractJpegFromDngBuffer(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const len = bytes.length;
      let bestStart = -1;
      let bestEnd = -1;
      let maxLen = 0;

      for (let i = 0; i < len - 10; i++) {
        if (bytes[i] === 0xFF && bytes[i + 1] === 0xD8 && bytes[i + 2] === 0xFF) {
          for (let j = i + 4096; j < len - 1; j++) {
            if (bytes[j] === 0xFF && bytes[j + 1] === 0xD9) {
              const segLen = j + 2 - i;
              if (segLen > maxLen) {
                maxLen = segLen;
                bestStart = i;
                bestEnd = j + 2;
              }
              i = j;
              break;
            }
          }
        }
      }
      if (bestStart !== -1 && maxLen > 12000) {
        const jpegSlice = bytes.subarray(bestStart, bestEnd);
        return new Blob([jpegSlice], { type: 'image/jpeg' });
      }
      return null;
    }

    function processImageFileToDataUrl(file, callback) {
      if (!file) return;
      const isDngOrRaw = /\.(dng|raw|cr2|nef|arw)$/i.test(file.name);

      const compressAndFinish = (imageSourceUrl) => {
        const img = new Image();
        img.onload = function () {
          try {
            const canvas = document.createElement('canvas');
            const maxDim = 1280;
            let w = img.width || 1200;
            let h = img.height || 800;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.84);
            callback(compressed);
          } catch (err) {
            callback(imageSourceUrl);
          }
        };
        img.onerror = function () {
          showToast('ไม่สามารถถอดรหัสไฟล์ภาพนี้ได้ กรุณาเลือกไฟล์ JPG หรือ PNG', 'error');
        };
        img.src = imageSourceUrl;
      };

      if (isDngOrRaw) {
        showToast(`กำลังสแกนดึงภาพความละเอียดสูงจากไฟล์โดรน ${file.name}...`);
        const bufReader = new FileReader();
        bufReader.onload = function (ev) {
          const blob = extractJpegFromDngBuffer(ev.target.result);
          if (blob) {
            const blobUrl = URL.createObjectURL(blob);
            compressAndFinish(blobUrl);
          } else {
            const fallbackUrl = URL.createObjectURL(file);
            compressAndFinish(fallbackUrl);
          }
        };
        bufReader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function (e) {
          compressAndFinish(e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function handleSingleItemImageReplace(inputEl, targetId, isDroneSlide) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      processImageFileToDataUrl(file, (dataUrl) => {
        if (isDroneSlide) {
          const slide = state.djiSlides.find(s => s.id === targetId);
          if (slide) slide.url = dataUrl;
        }
        const galItem = state.gallery.find(g => g.id === targetId || g.id === 'gal-' + targetId);
        if (galItem) galItem.customUrl = dataUrl;

        saveDataToStorage();
        renderAll();
        closeModal();
        showToast('อัปเดตรูปภาพเรียบร้อยแล้ว!');
      });
    }

    function exportBookingsCSV() {
      if (state.bookings.length === 0) {
        showToast('ยังไม่มีรายการคำขอจองสำหรับส่งออกไฟล์ CSV', 'error');
        return;
      }
      const headers = ['RefCode', 'FullName', 'Phone', 'VisitDate', 'PackageCode', 'Adults', 'Children', 'TotalPersons', 'Status', 'Notes', 'CreatedAt'];
      const rows = state.bookings.map(b => [
        b.refCode,
        `"${(b.fullName || '').replace(/"/g, '""')}"`,
        `"${(b.phone || '').replace(/"/g, '""')}"`,
        b.visitDate,
        b.packageCode,
        b.adults || 1,
        b.children || 0,
        b.totalPersons || 1,
        b.status,
        `"${(b.notes || '').replace(/"/g, '""')}"`,
        b.createdAt || ''
      ]);
      const csv = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csv));
      link.setAttribute('download', `tad-phao-samphan-bookings-${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('ดาวน์โหลดไฟล์รายงานการจอง (CSV) เรียบร้อยแล้ว!');
    }

    function importSystemBackupJSON(inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          localStorage.setItem('tps_portal_state_v6', JSON.stringify(parsed));
          loadSavedData();
          renderAll();
          showToast('กู้คืนข้อมูลระบบจากไฟล์สำรองเรียบร้อยแล้ว!');
        } catch (err) {
          showToast('ไฟล์สำรองข้อมูลไม่ถูกต้อง กรุณาเลือกไฟล์ .JSON ที่ส่งออกจากระบบ', 'error');
        }
      };
      reader.readAsText(file);
    }

                    <div class="font-bold text-sm text-[#123D32]">${u.name}</div>
                    <div class="text-gray-500">Username: @${u.username} • สิทธิ์: <strong>${u.role}</strong></div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold text-[10px]">Active</span>
                    ${idx > 0 ? `<button onclick="state.adminUsers.splice(${idx}, 1); saveDataToStorage(); renderAll(); showToast('ลบบัญชีผู้ใช้แล้ว');" class="text-red-600 font-bold">ลบ</button>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>

            <form onsubmit="handleAddUserAdmin(event)" class="p-4 rounded-xl bg-[#F8F6EF] border space-y-3">
              <h3 class="font-bold text-sm text-[#123D32]">+ เพิ่มเจ้าหน้าที่ดูแลระบบใหม่</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input id="adm-usr-name" type="text" required placeholder="ชื่อ-นามสกุล / ตำแหน่ง *" class="px-3 py-2 rounded-lg border bg-white" />
                <input id="adm-usr-username" type="text" required placeholder="ชื่อผู้ใช้ (Username) *" class="px-3 py-2 rounded-lg border bg-white" />
                <select id="adm-usr-role" class="px-3 py-2 rounded-lg border bg-white font-bold">
                  <option value="Booking Manager">Booking Manager (รับจองคิวล่องแก่ง/แคมป์ปิ้ง)</option>
                  <option value="Content Editor">Content Editor (ดูแลเนื้อหาและรูปภาพ)</option>
                  <option value="Super Admin">Super Admin (ผู้บริหารสูงสุด)</option>
                </select>
              </div>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#123D32] text-white font-bold">เพิ่มผู้ใช้งาน</button>
            </form>
          </div>
        `;
      }

      main.innerHTML = `
        <section class="pt-32 sm:pt-36 pb-16 bg-[#F1EFE6] min-h-screen">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
            <div class="bg-[#123D32] text-[#F8F6EF] rounded-2xl p-6 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-[#C5A46D] text-[#123D32]">${state.adminRole}</span>
                <h1 class="text-xl sm:text-2xl font-bold mt-1">ระบบบริหารจัดการเว็บไซต์ — ตาดเผ่าสัมพัน (Admin CMS ครบ 12 เมนู)</h1>
              </div>
              <div class="flex flex-wrap gap-2 self-start sm:self-auto">
                <button onclick="state.portal='public'; renderAll();" class="px-4 py-2 rounded-xl bg-[#C5A46D] text-[#123D32] text-xs font-bold shadow">👁️ ดูหน้าเว็บไซต์หลัก</button>
                <button onclick="state.adminAuthenticated=false; renderAll();" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold">ออกจากระบบ</button>
              </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <aside class="lg:col-span-3 bg-white rounded-2xl p-3 shadow-sm border space-y-1 h-fit">
                ${tabs.map(tab => `
                  <button onclick="state.adminTab='${tab.id}'; renderAll();" class="w-full flex items-center justify-between text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                    state.adminTab === tab.id ? 'bg-[#123D32] text-[#C5A46D] shadow' : 'text-[#123D32] hover:bg-[#F8F6EF]'
                  }">
                    <span class="truncate">${tab.label}</span>
                    ${tab.badge ? `<span class="px-2 py-0.5 rounded-full bg-amber-400 text-[#123D32] text-[10px] font-bold">${tab.badge}</span>` : ''}
                  </button>
                `).join('')}
              </aside>
              <div class="lg:col-span-9 bg-white rounded-2xl p-6 shadow-sm border min-w-0">${panelHtml}</div>
            </div>
          </div>
        </section>
      `;
    }

    // ============================================================================
    // 12. MODALS & INTERACTIVE HANDLERS (BOOKING, LIGHTBOX, NEWS, SEO)
    // ============================================================================
    function openBookingWithPackage(pkgCode) {
      renderModal({ type: 'booking', pkgCode: pkgCode || 'PKG-RFT', createdBooking: null });
    }

    function openLightbox(itemId) {
      const item = state.gallery.find(g => g.id === itemId);
      if (item) renderModal({ type: 'lightbox', item });
    }

    function openNewsModal(newsId) {
      const article = state.newsList.find(n => n.id === newsId);
      if (article) renderModal({ type: 'news', article });
    }

    function openSeoModal() {
      renderModal({ type: 'seo' });
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) {
        root.classList.add('hidden');
        root.innerHTML = '';
      }
    }

    function renderModal(config) {
      const root = document.getElementById('modal-root');
      const t = state.translations[state.lang] || state.translations.LA;
      root.classList.remove('hidden');

      if (config.type === 'booking') {
        if (config.createdBooking) {
          const b = config.createdBooking;
          root.innerHTML = `
            <div class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border my-8">
                <div class="bg-[#123D32] text-[#F8F6EF] p-5 flex items-center justify-between">
                  <h3 class="text-base sm:text-lg font-bold">ใบรับรองคำขอจองล่วงหน้า (Booking Request)</h3>
                  <button onclick="closeModal()" class="text-white font-bold">✕</button>
                </div>
                <div class="p-6 space-y-4 text-xs">
                  <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-900">
                    <strong>สถานะ: PENDING (รอเจ้าหน้าที่ยืนยัน)</strong> — ยังไม่มีการเรียกเก็บเงินออนไลน์จนกว่าจะได้รับการยืนยัน
                  </div>
                  <div class="p-4 rounded-xl bg-[#F8F6EF] border-2 border-dashed border-[#123D32]/30 space-y-2">
                    <div class="flex items-center justify-between border-b pb-2">
                      <span>รหัสอ้างอิง (Reference Code):</span>
                      <span class="font-mono font-bold text-base text-[#123D32]">${b.refCode}</span>
                    </div>
                    <div>ชื่อผู้จอง: <strong>${b.fullName}</strong> (${b.phone})</div>
                    <div>วันที่เดินทาง: <strong>${b.visitDate}</strong> | แพ็กเกจ: <strong>${b.packageCode}</strong></div>
                    <div>จำนวนผู้เดินทาง: ผู้ใหญ่ ${b.adults} ท่าน, เด็ก ${b.children} ท่าน</div>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="copyText('สวัสดีครับ ขอแจ้งรหัสจองล่วงหน้า ตาดเผ่าสัมพัน: ${b.refCode} ชื่อ: ${b.fullName} วันที่: ${b.visitDate} แพ็กเกจ: ${b.packageCode} จำนวน: ${b.totalPersons} ท่าน', 'คัดลอกข้อความสำหรับส่ง WhatsApp / LINE แล้ว!')" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold">
                      คัดลอกข้อความแจ้งจองส่งเข้า WhatsApp / LINE
                    </button>
                    <button onclick="window.print()" class="px-4 py-2.5 rounded-xl bg-[#236B50] text-white font-bold">พิมพ์ใบคำขอจอง</button>
                    <button onclick="closeModal(); state.lookupCodeInput='${b.refCode}'; navigateToPage('lookup'); runBookingLookup();" class="flex-1 py-2.5 rounded-xl bg-[#123D32] text-white font-bold">ตรวจสอบสถานะ</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          return;
        }

        const today = new Date().toISOString().split('T')[0];
        root.innerHTML = `
          <div class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border my-8">
              <div class="bg-[#123D32] text-[#F8F6EF] p-5 flex items-center justify-between">
                <h3 class="text-base sm:text-lg font-bold safe-text">${t.bookingModalTitle}</h3>
                <button onclick="closeModal()" class="text-white font-bold">✕</button>
              </div>
              <form onsubmit="submitBookingForm(event)" class="p-6 space-y-4 text-xs">
                <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 safe-text">${t.bookingDisclaimer}</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block font-semibold mb-1">${t.bkNameLabel}</label>
                    <input id="bk-name" type="text" required class="w-full px-3 py-2 rounded-lg border" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">${t.bkPhoneLabel}</label>
                    <input id="bk-phone" type="tel" required placeholder="+856 / +66" class="w-full px-3 py-2 rounded-lg border" />
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block font-semibold mb-1">${t.bkDateLabel}</label>
                    <input id="bk-date" type="date" required value="${today}" class="w-full px-3 py-2 rounded-lg border" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">${t.bkPkgLabel}</label>
                    <select id="bk-pkg" class="w-full px-3 py-2 rounded-lg border bg-white font-semibold">
                      ${state.tickets.filter(tk => tk.available).map(tk => `
                        <option value="${tk.code}" ${tk.code === config.pkgCode ? 'selected' : ''}>
                          ${tk.name[state.lang] || tk.name.TH} (${formatLAK(tk.priceLAK)})
                        </option>
                      `).join('')}
                    </select>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block font-semibold mb-1">${t.bkAdultsLabel}</label>
                    <input id="bk-adults" type="number" min="1" value="2" class="w-full px-3 py-2 rounded-lg border" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">${t.bkChildrenLabel}</label>
                    <input id="bk-children" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-lg border" />
                  </div>
                </div>
                <div>
                  <label class="block font-semibold mb-1">${t.bkNotesLabel}</label>
                  <textarea id="bk-notes" rows="2" class="w-full px-3 py-2 rounded-lg border"></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-[#123D32] hover:bg-[#236B50] text-white font-bold text-sm">${t.bkSubmitBtn}</button>
              </form>
            </div>
          </div>
        `;
      } else if (config.type === 'lightbox') {
        const item = config.item;
        root.innerHTML = `
          <div onclick="closeModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
            <div onclick="event.stopPropagation()" class="bg-[#123D32] text-[#F8F6EF] rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl border border-[#C5A46D]/40">
              <div class="h-72 sm:h-[440px] relative bg-black">
                ${item.youtubeId ? `
                  <iframe src="https://www.youtube.com/embed/${item.youtubeId}?autoplay=1&rel=0" class="w-full h-full border-0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                ` : `
                  <img src="${item.customUrl}" onerror="this.onerror=null;this.src='${item.fallbackUrl || REAL_MEDIA.dji0011_MainCurtain}';" class="w-full h-full object-contain bg-black" />
                `}
                <button onclick="closeModal()" class="absolute top-4 right-4 px-3 py-1.5 rounded-full bg-black/70 text-white font-bold">✕</button>
              </div>
              <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1 min-w-0">
                  <div class="text-xs text-[#C5A46D] font-bold">${item.sourceCredit || 'Tad Phao Samphan Official'}</div>
                  <h3 class="text-base sm:text-lg font-bold safe-text">${item.title[state.lang] || item.title.TH}</h3>
                  <p class="text-xs text-[#F8F6EF]/80 safe-text">${item.caption[state.lang] || item.caption.TH}</p>
                </div>
                <div class="file-upload-wrapper px-4 py-2.5 rounded-xl bg-[#C5A46D] text-[#123D32] text-xs font-bold shrink-0">
                  <span>📁 อัปโหลดรูปจริงแทนที่ภาพนี้</span>
                  <input type="file" accept="image/*,.dng" onchange="handleSingleItemImageReplace(this, '${item.id}', ${Boolean(item.isDroneSlide)})" />
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (config.type === 'news') {
        const a = config.article;
        root.innerHTML = `
          <div onclick="closeModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <div onclick="event.stopPropagation()" class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl">
              <div class="h-60 relative bg-[#123D32]">
                <img src="${a.imageUrl}" class="w-full h-full object-cover" />
                <button onclick="closeModal()" class="absolute top-4 right-4 px-3 py-1 rounded-full bg-black/60 text-white font-bold">✕</button>
              </div>
              <div class="p-6 space-y-3">
                <div class="text-xs text-gray-500">${a.date} • ${a.category}</div>
                <h3 class="text-xl font-bold text-[#123D32] safe-text">${a.title[state.lang] || a.title.TH}</h3>
                <p class="text-sm text-gray-700 leading-relaxed safe-text">${a.content[state.lang] || a.content.TH}</p>
              </div>
            </div>
          </div>
        `;
      } else if (config.type === 'seo') {
        root.innerHTML = `
          <div onclick="closeModal()" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <div onclick="event.stopPropagation()" class="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 text-xs">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="text-base font-bold text-[#123D32]">Sitemap.xml & SEO Configuration</h3>
                <button onclick="closeModal()" class="font-bold">✕</button>
              </div>
              <pre class="p-3 rounded-xl bg-[#0B2620] text-emerald-300 font-mono text-[11px] overflow-x-auto">&lt;urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"&gt;
  &lt;url&gt;&lt;loc&gt;https://tadphaosamphan.la/&lt;/loc&gt;&lt;/url&gt;
  &lt;url&gt;&lt;loc&gt;https://tadphaosamphan.la/experiences&lt;/loc&gt;&lt;/url&gt;
  &lt;url&gt;&lt;loc&gt;https://tadphaosamphan.la/tickets&lt;/loc&gt;&lt;/url&gt;
&lt;/urlset&gt;</pre>
            </div>
          </div>
        `;
      }
    }

    function submitBookingForm(e) {
      e.preventDefault();
      const fullName = document.getElementById('bk-name').value.trim();
      const phone = document.getElementById('bk-phone').value.trim();
      const visitDate = document.getElementById('bk-date').value;
      const packageCode = document.getElementById('bk-pkg').value;
      const adults = Number(document.getElementById('bk-adults').value || 1);
      const children = Number(document.getElementById('bk-children').value || 0);
      const notes = document.getElementById('bk-notes').value.trim();

      const refCode = 'TPS-' + Math.floor(100000 + Math.random() * 900000);
      const record = {
        id: 'bk-' + Date.now(),
        refCode,
        fullName,
        phone,
        visitDate,
        packageCode,
        adults,
        children,
        totalPersons: adults + children,
        notes,
        status: 'Pending',
        createdAt: new Date().toISOString()
      };

      state.bookings.unshift(record);
      saveDataToStorage();
      renderHeaderAndFooter();
      renderModal({ type: 'booking', pkgCode: packageCode, createdBooking: record });
      showToast(`บันทึกคำขอจองสำเร็จ! รหัสอ้างอิง: ${refCode}`);
    }

    function updateBookingStatus(id, nextStatus) {
      const bk = state.bookings.find(b => b.id === id);
      if (bk) {
        bk.status = nextStatus;
        saveDataToStorage();
        renderAll();
        showToast(`อัปเดตสถานะ ${bk.refCode} เป็น ${nextStatus}`);
      }
    }

    function runBookingLookup() {
      const code = state.lookupCodeInput.trim().toUpperCase();
      const found = state.bookings.find(b => b.refCode.toUpperCase() === code);
      state.lookupResult = found || 'NOT_FOUND';
      renderAll();
    }

    function handlePartnerSubmit(e) {
      e.preventDefault();
      state.partnerInquiries.unshift({
        id: 'ptn-' + Date.now(),
        companyName: document.getElementById('ptn-company').value.trim(),
        contactPerson: document.getElementById('ptn-person').value.trim(),
        phone: document.getElementById('ptn-phone').value.trim(),
        category: document.getElementById('ptn-cat').value,
        proposalSummary: document.getElementById('ptn-summary').value.trim()
      });
      saveDataToStorage();
      e.target.reset();
      showToast('ส่งข้อมูลพันธมิตรธุรกิจเรียบร้อยแล้ว!');
    }

    function handleContactSubmit(e) {
      e.preventDefault();
      state.contactInquiries.unshift({
        id: 'cnt-' + Date.now(),
        name: document.getElementById('cnt-name').value.trim(),
        contact: document.getElementById('cnt-contact').value.trim(),
        message: document.getElementById('cnt-msg').value.trim()
      });
      saveDataToStorage();
      e.target.reset();
      showToast('ส่งข้อความสอบถามเรียบร้อยแล้ว!');
    }

    function renderAll() {
      renderHeaderAndFooter();
      if (state.portal === 'admin') {
        renderAdminPortal();
      } else {
        renderPublicPortal();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      renderAll();
    });
  </script>
</body>
</html>
